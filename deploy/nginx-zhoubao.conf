# 将本文件放到 /etc/nginx/conf.d/zhoubao.conf。
#
# 会话 Cookie 与登录密码都走这个入口，所以**必须上 HTTPS**：明文部署时内网任一
# 节点都能直接抓到会话令牌并重放（Cookie 的 Secure 属性也要靠 HTTPS 才有意义）。
# 部署后记得：① 后端设 COOKIE_SECURE=true；② 证书路径按实际修改。
#
# 证书申请示例（需域名已解析到本机）：
#   certbot --nginx -d zhoubao.example.com

# HTTP 一律跳 HTTPS（健康检查留在 80，便于内网监控不带证书探测）
server {
    listen 80;
    server_name _;

    location = /api/health {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 用 listen ... http2 而不是独立的 `http2 on;`：后者需要 nginx ≥1.25.1，
    # 而宝塔面板自带的 nginx 常是 1.20~1.24，独立的 http2 指令会让配置直接解析失败。
    listen 443 ssl http2;
    server_name _;

    # ---- TLS ----
    ssl_certificate     /etc/nginx/ssl/zhoubao.crt;
    ssl_certificate_key /etc/nginx/ssl/zhoubao.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 会话令牌有效期内不允许被降级访问
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    # Agent 问答是 SSE 流式返回：必须关掉缓冲，否则 Nginx 会攒满一块才转发，
    # 前端退化成「等完整结果再一次性显示」（与 Next 那层代理要解决的问题相同）。
    location = /api/ai/agent/stream {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        # 长回答可能超过默认 60s，读超时放宽（上游自身有 ai_timeout 兜底）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端据此按客户端 IP 做登录限速（见 app/core/login_throttle.py）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # HTML 包含当前 release 的哈希 chunk，不能被宝塔/上游代理缓存跨版本复用。
        # 静态 _next 资源仍由其自身 immutable 缓存策略处理。
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
